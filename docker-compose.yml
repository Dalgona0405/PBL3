services:
  # -------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL 18
  # -------------------------------------------------------------------
  postgres-db:
    image: postgres:18-alpine
    container_name: sjsp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-JobSeeking_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - sjsp_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-JobSeeking_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. BACKEND ASP.NET CORE 8 WEB API
  # -------------------------------------------------------------------
  backend-api:
    build:
      context: ./Backend/JobSeekingAPI
      dockerfile: Dockerfile
    container_name: sjsp_backend_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${DB_NAME:-JobSeeking_DB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-admin}
      - PythonAI__BaseUrl=http://ai-service:8000
      - Jwt__SecretKey=THIS_IS_A_VERY_SECRET_KEY_FOR_JOB_SEEKING_API_2026_SUPER_SAFE_AND_EXTRA_LONG
    ports:
      - "5000:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - sjsp_network

  # -------------------------------------------------------------------
  # 3. PYTHON AI SERVICE
  # -------------------------------------------------------------------
  ai-service:
    build:
      context: ./AI_Service
      dockerfile: Dockerfile
    container_name: sjsp_ai_service
    restart: unless-stopped
    environment:
      # Trỏ thẳng sang tên service của Backend C# ở cổng nội bộ 8080!
      - CSHARP_API_URL=http://backend-api:8080
    ports:
      - "8000:8000"
    depends_on:
      backend-api:
        condition: service_started
    networks:
      - sjsp_network

volumes:
  pg_data:

networks:
  sjsp_network:
    driver: bridge
