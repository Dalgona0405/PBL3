services:
  # -------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU POSTGRESQL 18
  # -------------------------------------------------------------------
  postgres-db:
    image: postgres:18-alpine
    container_name: sjsp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-JobSeeking_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - sjsp_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-JobSeeking_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. BACKEND ASP.NET CORE 8 WEB API
  # -------------------------------------------------------------------
  backend-api:
    build:
      context: ./Backend/JobSeekingAPI
      dockerfile: Dockerfile
    container_name: sjsp_backend_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${DB_NAME:-JobSeeking_DB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-admin}
      - PythonAI__BaseUrl=http://ai-service:8000
      - Jwt__SecretKey=${JWT_SECRET}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__ServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY}
      - Supabase__CvBucket=${SUPABASE_CV_BUCKET:-resumes}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL}
    ports:
      - "5000:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - sjsp_network

  # -------------------------------------------------------------------
  # 3. PYTHON AI SERVICE
  # -------------------------------------------------------------------
  ai-service:
    build:
      context: ./AI_Service
      dockerfile: Dockerfile
    container_name: sjsp_ai_service
    restart: unless-stopped
    environment:
      # Trỏ thẳng sang tên service của Backend C# ở cổng nội bộ 8080!
      - CSHARP_API_URL=http://backend-api:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backend-api:
        condition: service_started
    networks:
      - sjsp_network

volumes:
  pg_data:

networks:
  sjsp_network:
    driver: bridge
